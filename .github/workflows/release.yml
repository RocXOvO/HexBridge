name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hexbridge-stable-release
  cancel-in-progress: false
  queue: max

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hydrate Electron runtime once
        run: node -e "const fs=require('node:fs'); const executable=require('electron'); if (!fs.existsSync(executable)) throw new Error('Electron runtime is unavailable'); console.log('Electron runtime ready')"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-release-version.mjs
      - run: npm audit --audit-level=high
      - name: Verify existing public update channel
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run test:update:public
      - run: npm run ocr:models
      - run: npm run test:ocr
      - run: npm run test:ocr:fixture
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:release-retention
      - run: npm run pack:win
      - run: npm run verify:update-metadata
      - run: npm run test:ui:packaged
      - run: npm run test:bridge:packaged
      - run: npm run test:update:packaged
      - run: npm run checksums
      - name: Render stable update channel
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run render:update-channel
      - name: Preflight stable release
        id: stable_release_preflight
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run preflight:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HexBridge-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') && steps.stable_release_preflight.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          overwrite_files: false
          files: |
            release/*.exe
            release/*.zip
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
      - name: Publish stable update channel
        if: startsWith(github.ref, 'refs/tags/v') && steps.stable_release_preflight.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run publish:update-channel
      - name: Verify public stable channel
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HEXBRIDGE_EXPECTED_UPDATE_VERSION: ${{ github.ref_name }}
        run: npm run test:update:public
      - name: Run packaged public update check
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run test:update:public:packaged
